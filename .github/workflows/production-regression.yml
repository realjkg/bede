name: Production deployment regression

# Proves the self-hosted production path actually works end-to-end, using a
# real Docker daemon (this sandbox that built the local-Postgres option and
# the setup wizard had the Docker CLI but no daemon, so this is the first
# place either has actually been run, not just validated by config parsing).
#
# Runs on a schedule so it keeps proving this on an ongoing basis even when
# nobody's touched the code recently (catching base-image updates, Alpine
# package drift, etc.) — not just "worked once when it was written."
#
# Uses a throwaway ANTHROPIC_API_KEY — the app never validates it at
# startup (only when an actual chat request comes in), so this proves the
# stack boots and serves traffic without making any real, billable Claude
# API calls.
on:
  schedule:
    - cron: '0 13 * * 1'  # every Monday, 13:00 UTC
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'Caddyfile'
      - 'homeschool-api/**'
      - 'homeschool-tutor/**'
      - 'scripts/setup_wizard/**'
      - 'scripts/trust_service/**'
      - 'setup.sh'
      - 'scripts/setup-gui-common.sh'
      - '.github/workflows/production-regression.yml'
  workflow_dispatch:

# No job here writes to the repo, comments on a PR, or creates a release —
# the default token only ever needs to check out code. Worth being
# explicit here specifically: this workflow both runs on push to main
# (where some org defaults grant read-write) and temporarily rewrites the
# checked-out copy of core/licensing.py so the stack trusts a throwaway CI
# keypair minted inside the runner itself. Least-privilege scoping still
# matters more than usual for a workflow mutating its checkout before a
# real Docker build.
permissions:
  contents: read

jobs:
  compose-config-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pycryptodome for throwaway license minting
        run: python3 -m pip install pycryptodome
      - name: Generate a throwaway signed LICENSE_KEY for this run
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import uuid
          from datetime import date, timedelta
          from pathlib import Path
          from Crypto.PublicKey import ECC
          from Crypto.Signature import eddsa

          def b64url(data: bytes) -> str:
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode("ascii")

          key = ECC.generate(curve="ed25519")
          public_pem = key.public_key().export_key(format="PEM")

          issued = date.today()
          expires = issued + timedelta(days=30)
          payload = {
              "id": str(uuid.uuid4()),
              "licensee": "CI production regression",
              "tier": "trial",
              "seats": 10,
              "issued": issued.isoformat(),
              "expires": expires.isoformat(),
          }
          payload_bytes = json.dumps(payload, separators=(",", ":"), sort_keys=True).encode("utf-8")
          signature = eddsa.new(key, "rfc8032").sign(payload_bytes)
          license_key = f"{b64url(payload_bytes)}.{b64url(signature)}"

          env_path = Path(os.environ["GITHUB_ENV"])
          with env_path.open("a", encoding="utf-8") as fh:
              fh.write(f"CI_TEST_LICENSE_KEY={license_key}\n")

          licensing_path = Path("homeschool-api/core/licensing.py")
          text = licensing_path.read_text(encoding="utf-8")
          replacement = f'PUBLIC_KEY_PEM = """{public_pem}"""'
          updated, count = re.subn(r'PUBLIC_KEY_PEM = """.*?"""', replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("could not locate PUBLIC_KEY_PEM in homeschool-api/core/licensing.py")
          licensing_path.write_text(updated, encoding="utf-8")
          PY
      # Generated per run rather than hardcoded. A literal PIN committed
      # here is published exactly like the one in .env.example was, and
      # that value (602656) is now refused at boot for precisely that
      # reason — which is what turned this job red for five runs. Calling
      # the app's own suggest_pin() also proves the generator and the
      # policy that judges it cannot drift apart.
      - name: Generate a throwaway CHILD_PIN for this run
        run: |
          echo "CI_CHILD_PIN=$(python3 -c 'import sys; sys.path.insert(0, "homeschool-api"); from core.pin_policy import suggest_pin; print(suggest_pin())')" >> "$GITHUB_ENV"
      - name: Validate managed-DB mode
        run: |
          cat > .env <<EOF
          ANTHROPIC_API_KEY=test
          SECRET_KEY=test
          MASTER_SECRET=test
          PARENT_PASSWORD=test
          CHILD_PIN=${CI_CHILD_PIN}
          DATABASE_URL=postgresql+asyncpg://user:pass@host/db
          LICENSE_KEY=${CI_TEST_LICENSE_KEY}
          EOF
          docker compose config --quiet
          # db service must NOT be included when the local-db profile isn't active
          test -z "$(docker compose config --services | grep '^db$')"
          # trust (the no-CLI tablet-onboarding page) has nothing to do with
          # DB choice — it must always be present either way
          docker compose config --services | grep -q '^trust$'
          rm .env
      - name: Validate local-DB mode
        run: |
          cat > .env <<EOF
          ANTHROPIC_API_KEY=test
          SECRET_KEY=test
          MASTER_SECRET=test
          PARENT_PASSWORD=test
          CHILD_PIN=${CI_CHILD_PIN}
          DATABASE_URL=postgresql+asyncpg://sage:testpass@db:5432/bede
          COMPOSE_PROFILES=local-db
          POSTGRES_PASSWORD=testpass
          LICENSE_KEY=${CI_TEST_LICENSE_KEY}
          EOF
          docker compose config --quiet
          docker compose config --services | grep -q '^db$'
          rm .env
      - name: Validate no-Anthropic mode (local self-hosted provider only)
        # The actual point of removing docker-compose.yml's old
        # `ANTHROPIC_API_KEY:?required` — proves a family can configure
        # Bede with ONLY a self-hosted model and no cloud AI account at
        # all, not just that ANTHROPIC_API_KEY happens to be unset while
        # some other required var papers over it.
        run: |
          cat > .env <<EOF
          BEDE_ADAPTER_ORDER=local
          LOCAL_LLM_BASE_URL=http://gpu-box.lan:8000/v1
          SECRET_KEY=test
          MASTER_SECRET=test
          PARENT_PASSWORD=test
          CHILD_PIN=${CI_CHILD_PIN}
          DATABASE_URL=postgresql+asyncpg://user:pass@host/db
          LICENSE_KEY=${CI_TEST_LICENSE_KEY}
          EOF
          docker compose config --quiet
          # Confirm the interpolated config genuinely carries no Anthropic
          # credential and does carry the local provider's — a config that
          # silently fell back to some other default would still pass a
          # bare `--quiet` check.
          docker compose config | grep -q 'ANTHROPIC_API_KEY: ""'
          docker compose config | grep -q 'LOCAL_LLM_BASE_URL: http://gpu-box.lan:8000/v1'
          rm .env

  wizard-end-to-end:
    runs-on: ubuntu-latest
    needs: compose-config-validation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pycryptodome for throwaway license minting
        run: python3 -m pip install pycryptodome
      - name: Generate a throwaway signed LICENSE_KEY for this run
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import uuid
          from datetime import date, timedelta
          from pathlib import Path
          from Crypto.PublicKey import ECC
          from Crypto.Signature import eddsa

          def b64url(data: bytes) -> str:
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode("ascii")

          key = ECC.generate(curve="ed25519")
          public_pem = key.public_key().export_key(format="PEM")

          issued = date.today()
          expires = issued + timedelta(days=30)
          payload = {
              "id": str(uuid.uuid4()),
              "licensee": "CI production regression",
              "tier": "trial",
              "seats": 10,
              "issued": issued.isoformat(),
              "expires": expires.isoformat(),
          }
          payload_bytes = json.dumps(payload, separators=(",", ":"), sort_keys=True).encode("utf-8")
          signature = eddsa.new(key, "rfc8032").sign(payload_bytes)
          license_key = f"{b64url(payload_bytes)}.{b64url(signature)}"

          env_path = Path(os.environ["GITHUB_ENV"])
          with env_path.open("a", encoding="utf-8") as fh:
              fh.write(f"CI_TEST_LICENSE_KEY={license_key}\n")

          licensing_path = Path("homeschool-api/core/licensing.py")
          text = licensing_path.read_text(encoding="utf-8")
          replacement = f'PUBLIC_KEY_PEM = """{public_pem}"""'
          updated, count = re.subn(r'PUBLIC_KEY_PEM = """.*?"""', replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("could not locate PUBLIC_KEY_PEM in homeschool-api/core/licensing.py")
          licensing_path.write_text(updated, encoding="utf-8")
          PY

      # Generated per run rather than hardcoded. A literal PIN committed
      # here is published exactly like the one in .env.example was, and
      # that value (602656) is now refused at boot for precisely that
      # reason — which is what turned this job red for five runs. Calling
      # the app's own suggest_pin() also proves the generator and the
      # policy that judges it cannot drift apart.
      - name: Generate a throwaway CHILD_PIN for this run
        run: |
          echo "CI_CHILD_PIN=$(python3 -c 'import sys; sys.path.insert(0, "homeschool-api"); from core.pin_policy import suggest_pin; print(suggest_pin())')" >> "$GITHUB_ENV"

      - name: Build the setup wizard image
        run: docker build -t bede-setup-wizard -f scripts/setup_wizard/Dockerfile .

      - name: Run the wizard and submit the setup form (local-DB path)
        run: |
          docker run --rm -d --name wizard -p 8765:8765 \
            -e HOST_LAN_IP=192.168.1.50 \
            -v "$(pwd)":/repo \
            --user "$(id -u):$(id -g)" \
            bede-setup-wizard
          for i in $(seq 1 20); do
            curl -sf http://localhost:8765/ >/dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:8765/ | grep -q "Let's set up Bede"

          curl -sf -X POST http://localhost:8765/submit \
            --data-urlencode "anthropic_key=sk-ant-ci-test-key" \
            --data-urlencode "db_choice=local" \
            --data-urlencode "parent_password=cipassword123" \
            --data-urlencode "child_pin=${CI_CHILD_PIN}" \
            --data-urlencode "license_key=${CI_TEST_LICENSE_KEY}" \
            | grep -q "All set"

          # wizard.py signals success by exiting its own process — confirm
          # the container actually stops on its own within a few seconds,
          # exactly the signal the real launcher scripts wait on.
          for i in $(seq 1 20); do
            docker ps --filter "name=wizard" --filter "status=running" -q | grep -q . || break
            sleep 0.5
          done
          if docker ps --filter "name=wizard" --filter "status=running" -q | grep -q .; then
            echo "Wizard container did not exit after a successful submission"
            docker logs wizard || true
            exit 1
          fi

      - name: Verify the generated .env
        run: |
          test -f .env
          grep -q '^ANTHROPIC_API_KEY=sk-ant-ci-test-key$' .env
          grep -q '^COMPOSE_PROFILES=local-db$' .env
          grep -q '^POSTGRES_PASSWORD=' .env
          grep -q "^CHILD_PIN=${CI_CHILD_PIN}\$" .env
          grep -q "^LICENSE_KEY=${CI_TEST_LICENSE_KEY}\$" .env
          grep -q '@db:5432/bede$' .env
          [ "$(stat -c '%a' .env)" = "600" ]

      - name: Upload .env as an artifact for the next job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wizard-generated-env
          path: .env
          retention-days: 1
          # v4 excludes dotfiles by default — .env is exactly that, and
          # without this the upload silently succeeds with zero files
          # (a warning, not a failure), which only surfaces as a confusing
          # "artifact not found" in the NEXT job's download step.
          include-hidden-files: true

  full-stack-boot:
    runs-on: ubuntu-latest
    needs: wizard-end-to-end
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pycryptodome for throwaway license minting
        run: python3 -m pip install pycryptodome
      - name: Generate a throwaway signed LICENSE_KEY for this run
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import uuid
          from datetime import date, timedelta
          from pathlib import Path
          from Crypto.PublicKey import ECC
          from Crypto.Signature import eddsa

          def b64url(data: bytes) -> str:
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode("ascii")

          key = ECC.generate(curve="ed25519")
          public_pem = key.public_key().export_key(format="PEM")

          issued = date.today()
          expires = issued + timedelta(days=30)
          payload = {
              "id": str(uuid.uuid4()),
              "licensee": "CI production regression",
              "tier": "trial",
              "seats": 10,
              "issued": issued.isoformat(),
              "expires": expires.isoformat(),
          }
          payload_bytes = json.dumps(payload, separators=(",", ":"), sort_keys=True).encode("utf-8")
          signature = eddsa.new(key, "rfc8032").sign(payload_bytes)
          license_key = f"{b64url(payload_bytes)}.{b64url(signature)}"

          env_path = Path(os.environ["GITHUB_ENV"])
          with env_path.open("a", encoding="utf-8") as fh:
              fh.write(f"CI_TEST_LICENSE_KEY={license_key}\n")

          licensing_path = Path("homeschool-api/core/licensing.py")
          text = licensing_path.read_text(encoding="utf-8")
          replacement = f'PUBLIC_KEY_PEM = """{public_pem}"""'
          updated, count = re.subn(r'PUBLIC_KEY_PEM = """.*?"""', replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("could not locate PUBLIC_KEY_PEM in homeschool-api/core/licensing.py")
          licensing_path.write_text(updated, encoding="utf-8")
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wizard-generated-env

      - name: Start the full stack (as the wizard configured it)
        run: docker compose up -d --build

      # Real, measured image sizes from a real build — not a hand-typed
      # estimate in a doc that goes stale the moment a dependency changes.
      # docs/PARENT_SETUP.md and docs/UNIX_INSTALLER.md point families here
      # (this job's own log) for current numbers rather than committing to
      # exact figures that would silently drift out of date. See the
      # torch-CPU-only fix in homeschool-api/Dockerfile's own comment for
      # why the api image's size in particular is worth watching — a
      # regression there (e.g. a new dependency accidentally reintroducing
      # a full CUDA wheel) would show up here first.
      - name: Report built image sizes (for docs/PARENT_SETUP.md's disk-space guidance)
        run: |
          echo "## Built image sizes" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker images --format '{{.Repository}}:{{.Tag}}  {{.Size}}' \
            | grep -E '^bede-' | sort >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker images --format '{{.Repository}}:{{.Tag}}  {{.Size}}' | grep -E '^bede-' | sort

      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -skf https://localhost/api/health >/dev/null 2>&1; then
              echo "Healthy after $((i / 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "API never became healthy. Diagnostics:"
          echo "--- docker compose ps ---"
          docker compose ps
          echo "--- curl -v https://localhost/api/health ---"
          curl -vsk https://localhost/api/health 2>&1 || true
          echo "--- curl -v https://localhost/ (through nginx directly, no /api prefix) ---"
          curl -vsk https://localhost/ 2>&1 || true
          echo "--- direct to api container's own port, bypassing nginx/caddy ---"
          docker compose exec -T api curl -sf http://localhost:8000/health 2>&1 || true
          echo "--- docker compose logs ---"
          docker compose logs
          exit 1

      - name: Confirm the license is ACTIVE, not just that the app booted
        # /health is deliberately on the license gate's allowlist
        # (core/middleware.py's LicenseGateMiddleware), so ever since an
        # unlicensed production instance started booting into gated mode
        # instead of refusing to start, a healthy /health alone can no
        # longer prove the injected CI license actually verified and lifted
        # the gate. This step closes that gap: a gated instance answers
        # every non-allowlisted path with a license_required 403 before
        # auth even runs, so a normal auth-shaped 401/403 here proves the
        # gate is NOT up.
        #
        # THIS STEP BLOCKS. If the just-minted CI license fails to verify,
        # fails to reach the app, or the gate otherwise stays up, this step
        # fails the job and reds `main`. That is the point: an entitlement
        # check that cannot fail the build is not a check, and the two
        # revisions before this one proved it — `continue-on-error: true`
        # plus an `::error::` annotation, then that annotation re-emitted by
        # a final always() step, both of which left the job GREEN while the
        # gate went unverified. An annotation is a message; only a non-zero
        # exit is a gate.
        #
        # The "keep later coverage even when this fails" part is preserved:
        # the tablet-trust and Postgres backup/restore checks now carry
        # `if: success() || steps.license_check.conclusion == 'failure'`,
        # so they still run when this step is the only thing that failed.
        # Coverage is kept; the green job is not.
        #
        # Why /health cannot do this job: /health is on the license gate's
        # allowlist (core/middleware.py's LicenseGateMiddleware), so ever
        # since an unlicensed production instance began booting into gated
        # mode instead of refusing to start, a healthy /health would sail
        # through while the instance sat gated. A gated instance answers
        # every non-allowlisted path with a license_required 403 before
        # auth even runs, so an auth-shaped 401/403 from /pod/configs
        # proves the gate is DOWN and the license verified and unexpired.
        id: license_check
        run: |
          body=$(curl -sk https://localhost/api/pod/configs)
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/pod/configs)
          if echo "$body" | grep -q 'license_required'; then
            msg="The workflow-minted CI license did not lift the gate — production-regression has not actually proven the licensed production path this run."
            echo "::error title=License gate still active::${msg}"
            {
              echo "## :rotating_light: License gate NOT verified this run"
              echo "${msg}"
              echo ""
              echo "Response: \`${body}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$msg"
            echo "Response: $body"
            exit 1
          fi
          if [ "$code" != "401" ] && [ "$code" != "403" ]; then
            msg="Expected an auth-shaped 401/403 from an unauthenticated /pod/configs, got ${code} instead — the license gate did not behave as expected."
            echo "::error title=License gate check failed::${msg}"
            {
              echo "## :rotating_light: License gate check failed"
              echo "${msg}"
              echo ""
              echo "Response: \`${body}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$msg"
            echo "Response: $body"
            exit 1
          fi
          echo "License gate verified: the workflow-minted CI license lifts correctly." >> "$GITHUB_STEP_SUMMARY"
          echo "License gate is down (auth answered normally) — the CI license is active."

      - name: Confirm the no-CLI tablet-trust page works end-to-end
        if: success() || steps.license_check.conclusion == 'failure'
        run: |
          ok=true

          # Plain HTTP, not redirected — a new device hasn't trusted the
          # cert yet, so this must stay reachable without HTTPS. curl -f
          # swallows the actual status code on failure, so capture it
          # explicitly with -w instead of relying on -f's pass/fail alone —
          # cost real debugging time the first time this failed silently.
          bare_code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/trust)
          if [ "$bare_code" != "302" ]; then
            echo "Expected 302 (redirect to /trust/) from bare /trust, got $bare_code"; ok=false
          fi

          index_code=$(curl -sL -o index.html -w '%{http_code}' http://localhost/trust)
          if [ "$index_code" != "200" ] || ! grep -q "Add a tablet to Bede" index.html; then
            echo "Expected 200 + instructions page from /trust (following redirect), got $index_code"; ok=false
          fi

          qr_code=$(curl -s -o qr.svg -w '%{http_code}' http://localhost/trust/qr.svg)
          if [ "$qr_code" != "200" ] || ! grep -q "<svg" qr.svg; then
            echo "Expected 200 + svg from /trust/qr.svg, got $qr_code"; ok=false
          fi

          cert_code=$(curl -s -o downloaded-root-ca.crt -w '%{http_code}' http://localhost/trust/root-ca.crt)
          docker compose exec -T caddy cat /data/caddy/pki/authorities/local/root.crt > actual-root-ca.crt
          if [ "$cert_code" != "200" ] || ! diff -q downloaded-root-ca.crt actual-root-ca.crt >/dev/null; then
            echo "Expected 200 + matching cert from /trust/root-ca.crt, got $cert_code"; ok=false
          fi

          # Guard against a regression that accidentally turns off the
          # HTTPS redirect for everything else while adding the /trust
          # exception (handle-block ordering is easy to get backwards).
          redirect_code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)
          if [ "$redirect_code" != "301" ] && [ "$redirect_code" != "308" ]; then
            echo "Expected a redirect for http://localhost/, got $redirect_code"; ok=false
          fi

          if [ "$ok" = "false" ]; then
            echo "--- docker compose ps ---"
            docker compose ps
            echo "--- curl -v http://localhost/trust ---"
            curl -v http://localhost/trust 2>&1 || true
            echo "--- curl -v http://localhost/trust/ ---"
            curl -v http://localhost/trust/ 2>&1 || true
            echo "--- trust container: is it actually listening on 8080? ---"
            docker compose exec -T trust python3 -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8080/', timeout=3).status)" 2>&1 || true
            echo "--- docker compose logs trust caddy ---"
            docker compose logs trust caddy
            exit 1
          fi

      - name: Confirm local Postgres backup/restore actually restores lost data
        if: success() || steps.license_check.conclusion == 'failure'
        # Before this, the step below only proved a restore leaves the API
        # able to boot and answer /health afterward — it never confirmed
        # any actual DATA survived. Worse, `make db-restore` was being run
        # on top of a database that STILL HAD ALL ITS ORIGINAL DATA (never
        # wiped first): pg_dump's plain-SQL restore replays `COPY ... FROM
        # stdin` per table inside one implicit transaction, so the first
        # row that collides with an existing primary key rolls back that
        # WHOLE table's restore — and psql's default (non-ON_ERROR_STOP)
        # behavior just prints the error and moves on rather than failing
        # the script. So the previous version of this step was silently
        # exercising almost nothing: restoring onto live, already-populated
        # tables mostly no-ops, then "the API is healthy afterward" was
        # trivially true because the data was never actually touched.
        #
        # This now tests the real disaster-recovery scenario a family
        # would actually hit — data is GONE, restore it from a backup —
        # by wiping the schema before restoring, then comparing a DATA-ONLY
        # snapshot taken right before the wipe against one taken right
        # after restore. No API/auth/license dependency at all (sidesteps

        # see docs/SECURITY.md's Known open gaps — entirely, rather than
        # inheriting it), and it's a stronger check than probing one field
        # through the API: pg_dump serializes the raw encrypted BYTEA
        # column bytes directly, so an identical diff proves every table's
        # DATA — including encryption_config's wrapped DATA_KEY — survives
        # the round trip intact, not just one hand-picked record.
        #
        # Deliberately --data-only/--no-owner/--no-privileges/--no-comments
        # for the COMPARISON snapshots specifically (the real backup two
        # lines below, the one a family would actually restore from, stays
        # a full unmodified `make db-backup` — untouched by any of this):
        # a first attempt diffed two full dumps directly and got real,
        # confusing false positives — recreating the schema via DROP/CREATE
        # leaves it owned by a different role than the original
        # initdb-created one, so pg_dump legitimately emits extra ALTER
        # SCHEMA OWNER/REVOKE/COMMENT statements for the restored schema
        # that were never in the original (a metadata artifact of the wipe
        # method, not a data-loss signal) — and pg_dump 16 also wraps every
        # dump in a `\restrict`/`\unrestrict` pair carrying a random token
        # that's never the same twice by design. Data-only sidesteps the
        # schema-ownership noise entirely; the two `grep -Fv` calls strip
        # the random restrict/unrestrict wrapper lines, the only other
        # legitimately-nondeterministic-but-harmless output pg_dump adds.
        run: |
          set -e
          echo "--- Snapshotting data before the wipe (comparison only — the real backup below is untouched) ---"
          docker compose exec -T db pg_dump -U sage --data-only --no-owner --no-privileges --no-comments --no-security-labels bede \
            | grep -Fv '\restrict' | grep -Fv '\unrestrict' > before-data.sql

          echo "--- Taking the real backup a family would actually restore from ---"
          make db-backup
          ls backups/*.sql
          BACKUP_FILE=$(ls -t backups/*.sql | head -1)

          echo "--- Wiping the schema to simulate real data loss ---"
          docker compose exec -T db psql -U sage -d bede -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"

          echo "--- Restoring from the backup taken before the wipe ---"
          make db-restore FILE="$BACKUP_FILE"

          echo "--- Comparing data before the wipe against data after the restore ---"
          docker compose exec -T db pg_dump -U sage --data-only --no-owner --no-privileges --no-comments --no-security-labels bede \
            | grep -Fv '\restrict' | grep -Fv '\unrestrict' > after-data.sql
          if ! diff before-data.sql after-data.sql > dump-diff.txt; then
            echo "Restored data differs from what was backed up — the restore did NOT preserve data intact:"
            cat dump-diff.txt
            exit 1
          fi
          echo "Backup/restore verified: every table's data survived a full wipe-and-restore round trip intact." >> "$GITHUB_STEP_SUMMARY"

          echo "--- Confirming the API boots cleanly against the restored (previously wiped) database ---"
          # restart so the API re-reads a freshly-restored DB cleanly
          docker compose restart api
          for i in $(seq 1 30); do
            curl -skf https://localhost/api/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "API did not come back healthy after a db-restore"
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v